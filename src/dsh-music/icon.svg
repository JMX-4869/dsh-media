<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="音乐台">
  <!-- 底：和音乐台自己的画布同色（#0d1117 抬亮一点） -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#12161d"/>
  <!-- 4×4 步进网格：暗格是没点的位置，亮格是写进去的音 -->
  <g fill="#2b3542">
    <rect x="11" y="11" width="9" height="9" rx="2"/><rect x="22" y="11" width="9" height="9" rx="2"/><rect x="33" y="11" width="9" height="9" rx="2"/><rect x="44" y="11" width="9" height="9" rx="2"/>
    <rect x="11" y="22" width="9" height="9" rx="2"/><rect x="22" y="22" width="9" height="9" rx="2"/><rect x="44" y="22" width="9" height="9" rx="2"/>
    <rect x="11" y="33" width="9" height="9" rx="2"/><rect x="22" y="33" width="9" height="9" rx="2"/><rect x="33" y="33" width="9" height="9" rx="2"/>
    <rect x="11" y="44" width="9" height="9" rx="2"/><rect x="22" y="44" width="9" height="9" rx="2"/><rect x="33" y="44" width="9" height="9" rx="2"/><rect x="44" y="44" width="9" height="9" rx="2"/>
  </g>
  <!-- 写进去的音：一条上扬的动机（和播放头的琥珀色一致 #e8b06a） -->
  <g fill="#e8b06a">
    <rect x="11" y="44" width="9" height="9" rx="2"/>
    <rect x="22" y="33" width="9" height="9" rx="2"/>
    <rect x="33" y="22" width="9" height="9" rx="2"/>
    <rect x="44" y="11" width="9" height="9" rx="2"/>
    <rect x="33" y="44" width="9" height="9" rx="2"/>
  </g>
</svg>
